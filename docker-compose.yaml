services:
  kafka:
    image: apache/kafka:4.1.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: M0ouM75nT9uYk7kJ0g3cJA
    networks: [pipeline-net]

  vector:
    image: timberio/vector:nightly-distroless-libc
    command: ["--config", "/etc/vector/vector.toml"]
    volumes: ["./docker/vector/config/vector.toml:/etc/vector/vector.toml:ro"]
    ports: ["514:514/udp"]
    depends_on: [kafka]
    networks: [pipeline-net]

  spark-master:
    image: apache/spark:4.1.0-preview4-scala2.13-java21-python3-r-ubuntu
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports: ["8080:8080", "7077:7077"]
    environment: [SPARK_MASTER_HOST=spark-master]
    networks: [pipeline-net]

  spark-worker:
    image: apache/spark:4.1.0-preview4-scala2.13-java21-python3-r-ubuntu
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on: [spark-master]
    environment: [SPARK_WORKER_CORES=2, SPARK_WORKER_MEMORY=2g]
    ports: ["8081:8081"]
    networks: [pipeline-net]

  elasticsearch:
    image: elasticsearch:9.2.1
    environment: [discovery.type=single-node, xpack.security.enabled=false]
    ports: ["9200:9200"]
    volumes: [es_data:/usr/share/elasticsearch/data]
    networks: [pipeline-net]

  kibana:
    image: kibana:9.2.1
    environment: [ELASTICSEARCH_HOSTS=http://elasticsearch:9200]
    ports: ["5601:5601"]
    depends_on: [elasticsearch]
    networks: [pipeline-net]

networks:
  pipeline-net:

volumes:
  es_data:
