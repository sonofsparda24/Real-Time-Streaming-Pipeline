# VECTOR – Receive syslog & send to Kafka

[sources.syslog_udp]
type = "syslog"
mode = "udp"
address = "0.0.0.0:514"

[transforms.parse_syslog]
type = "remap"
inputs = ["syslog_udp"]
source = '''
# Try parsing syslog
structured, err = parse_syslog(.message)

# If parsing succeeded, merge structured fields into event
if err == null {
  . = merge(., structured)
} else {
  .parse_error = err
}
'''

[sinks.kafka_out]
type = "kafka"
inputs = ["parse_syslog"]
bootstrap_servers = "kafka:9092"
topic = "syslog_raw"

[sinks.kafka_out.encoding]
codec = "json"
